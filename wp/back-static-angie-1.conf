server {
    listen 80;
    listen [::]:80;

    server_name _;

    root /var/www/html;

    location =/favicon.ico
 	         =/robots.txt {
        expires 1h;
        log_not_found off;
        try_files $uri =404;
    }

    location /wp-includes/
             /wp-content/uploads/ {
        expires max;
        try_files $uri =404;
    }

    location ~* \.(gif|ico|jpeg|jpg|png|pdf)$ {
        expires max;
        log_not_found off;
        try_files $uri =404;
    }

    location ~* \.(css|js|svg)$ {
        gzip on;
        gzip_static on;
        gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml
        expires max;
        log_not_found off;
        try_files $uri =404;
    }

    location / {
        return 404;
    }
}
